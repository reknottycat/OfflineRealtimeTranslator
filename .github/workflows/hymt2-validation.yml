name: HY-MT2 validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hymt2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hymt2-native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check unchanged llama.cpp pin
        run: test "$(git -C app/src/main/cpp/llama.cpp rev-parse HEAD)" = "b30a5fdf370aa4cec02f6bbcc899fbbf3e77e763"
      - name: Build shared Android inference core and profile contracts
        run: |
          cmake -S app/src/main/cpp/lmt -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build --parallel 4 --target hymt2-contract-tests lmt-contract-tests hymt2-smoke
          ctest --test-dir host-build --output-on-failure
      - name: Download real official HY-MT2 weights and verify SHA-256
        run: python3 scripts/hymt2_model_smoke.py download
      - name: Eight real Russian-to-Chinese translations, wrong-profile rejection and cancellation
        run: |
          ./host-build/hymt2-smoke /tmp/hymt2-smoke.gguf > hymt2-smoke.tsv 2> hymt2-smoke-stderr.log
          python3 scripts/hymt2_model_smoke.py check
      - name: Preserve source and inference evidence
        if: always()
        run: |
          git archive --format=tar.gz HEAD -o hymt2-source.tar.gz
          git rev-parse HEAD > hymt2-source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hymt2-native-inference-evidence
          path: |
            hymt2-smoke.tsv
            hymt2-smoke-stderr.log
            hymt2-model-download.json
            hymt2-smoke-report.json
            hymt2-source.tar.gz
            hymt2-source-commit.txt
            host-build/Testing/Temporary/LastTest.log
          retention-days: 30
