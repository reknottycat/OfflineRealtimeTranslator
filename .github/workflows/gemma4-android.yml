name: ChatGPT-inspired v4.2 Android frontend and APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: translator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check pinned llama.cpp
        run: test "$(git -C app/src/main/cpp/llama.cpp rev-parse HEAD)" = "b30a5fdf370aa4cec02f6bbcc899fbbf3e77e763"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK + pinned NDK + CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMGR"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Get and verify official sherpa-onnx v2.0.1 Android AAR
        run: python3 scripts/setup_sherpa_aar.py
      - name: Chat-style UI binding and accessibility contract
        run: python3 scripts/verify_ui_contract.py
      - name: Unit tests, lint and ARM64 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=4 --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify and package APK evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/apk-signature.txt
          python3 scripts/ci_lmt_report.py
          unzip -l dist/OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-debug.apk | grep 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-debug.apk | grep "name='com.bohanli.ruzhtranslator.preview.gigaam.chatstyle'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-debug.apk | grep "versionName='4.2-alpha-chatstyle'"
          mv dist/OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-debug.apk dist/OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-GigaAM-v4.2-chatstyle.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: APK download
        uses: actions/upload-artifact@v4
        with:
          name: OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-GigaAM-v4.2-chatstyle
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Test and lint reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30
  lmt-native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build shared Android JNI core and both contract suites
        run: |
          cmake -S app/src/main/cpp/lmt -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build --parallel 4 --target lmt-contract-tests hymt-contract-tests lmt-smoke hymt-smoke
          ctest --test-dir host-build --output-on-failure
      - name: Download and verify real pinned LMT weights
        run: python3 scripts/lmt_model_smoke.py download
      - name: LMT regression with real weights and cancellation
        run: |
          ./host-build/lmt-smoke /tmp/lmt-smoke.gguf > lmt-smoke.tsv 2> lmt-native.log
          python3 scripts/lmt_model_smoke.py check
      - name: LMT native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmt-native-inference-evidence
          path: |
            lmt-smoke.tsv
            lmt-native.log
            lmt-model-download.json
            lmt-smoke-report.json
            host-build/Testing/Temporary/LastTest.log
          retention-days: 30
  hymt-native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build shared Android JNI core and both contract suites
        run: |
          cmake -S app/src/main/cpp/lmt -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build --parallel 4 --target lmt-contract-tests hymt-contract-tests lmt-smoke hymt-smoke
          ctest --test-dir host-build --output-on-failure
      - name: Download and verify Tencent official pinned HY-MT2 weights
        run: python3 scripts/hymt_model_smoke.py download
      - name: HY-MT2 actual inference, repeated segments, streaming and cancellation
        run: |
          ./host-build/hymt-smoke /tmp/hymt-smoke.gguf > hymt-smoke.tsv 2> hymt-native.log
          python3 scripts/hymt_model_smoke.py check
      - name: HY-MT2 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hymt-native-inference-evidence
          path: |
            hymt-smoke.tsv
            hymt-native.log
            hymt-model-download.json
            hymt-smoke-report.json
            host-build/Testing/Temporary/LastTest.log
          retention-days: 30
