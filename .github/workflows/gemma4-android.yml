name: Gemma4 Android APK
on:
  pull_request:
  push:
    branches: [main, feat/gemma4-litertlm-model-hub]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (llama.cpp no longer compiled)
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OfflineRealtimeTranslator-gemma4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
