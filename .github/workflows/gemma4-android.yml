name: v4.4 Auto ASR Android APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: translator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            qnn_enabled: '0'
            enable_qnn: 'false'
            application_suffix: .preview.asrauto
          - backend: qnn
            qnn_enabled: '1'
            enable_qnn: 'true'
            application_suffix: .preview.asrauto.qnn
    env:
      APK_PATH: dist/OfflineRealtimeTranslator-v4.4-alpha-auto-asr-${{ matrix.backend }}-arm64.apk
      QNN_ENABLED: ${{ matrix.qnn_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check pinned llama.cpp
        run: test "$(git -C app/src/main/cpp/llama.cpp rev-parse HEAD)" = "b30a5fdf370aa4cec02f6bbcc899fbbf3e77e763"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK + pinned NDK + CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMGR"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify native Android dependencies
        run: python3 scripts/setup_sherpa_aar.py
      - name: Chat-style UI binding and accessibility contract
        run: python3 scripts/verify_ui_contract.py
      - name: Unit tests, lint and ARM64 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=4 --stacktrace -PenableQnn=${{ matrix.enable_qnn }} \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify and package APK evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPLICATION_ID: com.bohanli.ruzhtranslator${{ matrix.application_suffix }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH" > dist/apk-signature.txt
          python3 scripts/ci_lmt_report.py
          unzip -Z1 "$APK_PATH" > dist/apk-contents.txt
          grep -Fxq 'lib/arm64-v8a/libsherpa-onnx-jni.so' dist/apk-contents.txt
          mkdir -p "$RUNNER_TEMP/apk-abi"
          for library in libonnxruntime.so libonnxruntime4j_jni.so libsherpa-onnx-jni.so; do
            unzip -p "$APK_PATH" "lib/arm64-v8a/$library" > "$RUNNER_TEMP/apk-abi/$library"
            readelf --dyn-syms --wide "$RUNNER_TEMP/apk-abi/$library" > "$RUNNER_TEMP/apk-abi/$library.symbols"
          done
          if [[ "$QNN_ENABLED" == '1' ]]; then
            ort_version=1.28.1
            grep -Fxq 'lib/arm64-v8a/libLiteRt.so' dist/apk-contents.txt
            for library in libQnnHtp.so libQnnSystem.so libQnnHtpV79Stub.so libQnnHtpV79Skel.so libQnnHtpV81Stub.so libQnnHtpV81Skel.so; do
              grep -Fxq "lib/arm64-v8a/$library" dist/apk-contents.txt
              cmp <(unzip -p "$APK_PATH" "assets/qwen-npu-runtime/$library") \
                <(unzip -p app/libs/qnn-runtime-2.50.0.aar "jni/arm64-v8a/$library")
              grep -Fxq "assets/qwen-npu-runtime/$library" dist/apk-contents.txt
            done
            dispatcher=libLiteRtDispatch_Qualcomm.so
            grep -Fxq "assets/qwen-npu-runtime/$dispatcher" dist/apk-contents.txt
            cmp <(unzip -p "$APK_PATH" "assets/qwen-npu-runtime/$dispatcher") \
              <(unzip -p app/libs/litert-npu-runtime-qualcomm-2.3.0.aar "jni/arm64-v8a/$dispatcher")
            grep -Fq "OrtGetApiBase@VERS_$ort_version" "$RUNNER_TEMP/apk-abi/libsherpa-onnx-jni.so.symbols"
          else
            ort_version=1.17.3
            if grep -Eq '^(lib/arm64-v8a/libQnnHtp\.so|lib/arm64-v8a/libLiteRt\.so|assets/qwen-npu-runtime/)' dist/apk-contents.txt; then
              echo 'Unexpected Qualcomm runtime in the CPU APK' >&2
              exit 1
            fi
            readelf --dynamic "$RUNNER_TEMP/apk-abi/libsherpa-onnx-jni.so" > "$RUNNER_TEMP/apk-abi/sherpa.dynamic"
            if grep -Fq 'Shared library: [libonnxruntime.so]' "$RUNNER_TEMP/apk-abi/sherpa.dynamic"; then
              echo 'CPU Sherpa must link its own ONNX Runtime statically' >&2
              exit 1
            fi
          fi
          grep -Fq "OrtGetApiBase@@VERS_$ort_version" "$RUNNER_TEMP/apk-abi/libonnxruntime.so.symbols"
          grep -Fq "OrtGetApiBase@VERS_$ort_version" "$RUNNER_TEMP/apk-abi/libonnxruntime4j_jni.so.symbols"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" > dist/apk-badging.txt
          grep -F "name='$APPLICATION_ID' versionCode='44' versionName='4.4-alpha-auto-asr'" dist/apk-badging.txt
          (cd dist && sha256sum ./*.apk) > dist/SHA256SUMS.txt
      - name: APK download
        uses: actions/upload-artifact@v4
        with:
          name: OfflineRealtimeTranslator-v4.4-alpha-auto-asr-${{ matrix.backend }}-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Test and lint reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.backend }}-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30
  lmt-native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build shared Android JNI core and both contract suites
        run: |
          cmake -S app/src/main/cpp/lmt -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build --parallel 4 --target lmt-contract-tests hymt-contract-tests lmt-smoke hymt-smoke
          ctest --test-dir host-build --output-on-failure
      - name: Download and verify real pinned LMT weights
        run: python3 scripts/lmt_model_smoke.py download
      - name: LMT regression with real weights and cancellation
        run: |
          ./host-build/lmt-smoke /tmp/lmt-smoke.gguf > lmt-smoke.tsv 2> lmt-native.log
          python3 scripts/lmt_model_smoke.py check
      - name: LMT native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmt-native-inference-evidence
          path: |
            lmt-smoke.tsv
            lmt-native.log
            lmt-model-download.json
            lmt-smoke-report.json
            host-build/Testing/Temporary/LastTest.log
          retention-days: 30
  hymt-native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build shared Android JNI core and both contract suites
        run: |
          cmake -S app/src/main/cpp/lmt -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build --parallel 4 --target lmt-contract-tests hymt-contract-tests lmt-smoke hymt-smoke
          ctest --test-dir host-build --output-on-failure
      - name: Download and verify Tencent official pinned HY-MT2 weights
        run: python3 scripts/hymt_model_smoke.py download
      - name: HY-MT2 actual inference, repeated segments, streaming and cancellation
        run: |
          ./host-build/hymt-smoke /tmp/hymt-smoke.gguf > hymt-smoke.tsv 2> hymt-native.log
          python3 scripts/hymt_model_smoke.py check
      - name: HY-MT2 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hymt-native-inference-evidence
          path: |
            hymt-smoke.tsv
            hymt-native.log
            hymt-model-download.json
            hymt-smoke-report.json
            host-build/Testing/Temporary/LastTest.log
          retention-days: 30
