name: Publish three-engine preview APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-three-engine-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hy-mt2-engine
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test lint build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=4 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OfflineRealtimeTranslator-Gemma4-LMT-HYMT2-v3.5-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/*.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          TAG="v3.5-alpha-hymt2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title "v3.5 alpha: Gemma 4 + LMT + HY-MT2" --notes "Experimental ARM64 debug APK. HY-MT2 is in draft PR #3, not main. Models downloaded separately. On-device microphone and inference QA pending." --prerelease
          fi
