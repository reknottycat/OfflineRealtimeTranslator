name: Publish China-source download preview APK
on:
  push:
    branches: [feat/hy-mt2-engine]
    paths: [.github/workflows/publish-preview-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-translator-china-downloads
  cancel-in-progress: false
jobs:
  release-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build the pushed commit
        run: |
          chmod +x gradlew
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew --no-daemon --max-workers=4 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK and record exact build evidence
        env:
          APK_PATH: dist/OfflineRealtimeTranslator-v3.6-china-downloads-arm64.apk
          PR_HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH" > dist/apk-signature.txt
          python3 scripts/ci_lmt_report.py
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish unique prerelease with this exact tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v3.6-alpha-cn-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          China-first model download preview: verified ModelScope files for Gemma 4 and HY-MT2; HF Mirror and user-requested proxy candidates for fallback. LMT has no verified identical ModelScope GGUF yet. 4 MiB chunks, four parallel workers, persisted per-chunk verification, bounded retries and whole-file SHA-256 verification. Includes a pause/resume control.

          Experimental ARM64 debug APK, versionCode 36. Model weights are downloaded separately. Signing certificate is recorded in apk-signature.txt; it may differ from prior previews. Device-network speed, on-device inference and microphone/subtitle QA are not claimed. HY-MT2 remains in PR #3.
          NOTES
          echo "Source commit: $GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.txt"
          echo "Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.txt"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt dist/validation.json dist/apk-signature.txt \
            --target "$GITHUB_SHA" --title "v3.6 preview: 国内模型源与分块续传 (${GITHUB_SHA:0:8})" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease
          echo "### APK release" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve a direct GitHub download beside the old APK
        run: |
          set -euo pipefail
          git fetch origin apk-downloads
          git worktree add "$RUNNER_TEMP/direct-apk" origin/apk-downloads
          APK_DIR="v3.6-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUNNER_TEMP/direct-apk/$APK_DIR"
          cp dist/*.apk dist/SHA256SUMS.txt dist/validation.json dist/apk-signature.txt "$RUNNER_TEMP/direct-apk/$APK_DIR/"
          cd "$RUNNER_TEMP/direct-apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK_DIR"
          git commit -m "release: preserve China-download APK for $GITHUB_SHA"
          git push origin HEAD:refs/heads/apk-downloads
          echo "### Direct APK" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/apk-downloads/$APK_DIR/OfflineRealtimeTranslator-v3.6-china-downloads-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: China-downloads-APK-and-reports
          path: |
            dist/
            app/build/reports/
            app/build/test-results/
          retention-days: 30
